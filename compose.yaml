name: ai-curator
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-curator-app:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CURATOR_PORT:-8080}:8080"
    environment:
      CURATOR_LLM_RUNTIME: "${CURATOR_LLM_RUNTIME:-llama_cpp}"
      CURATOR_LLM_BASE_URL: http://model:8080
      CURATOR_LLM_MODEL: Qwen3-4B-Q4_K_M.gguf
      CURATOR_OLLAMA_BASE_URL: "${CURATOR_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      CURATOR_OLLAMA_MODEL: "${CURATOR_OLLAMA_MODEL:-ai-curator-gemma4-12b}"
      CURATOR_EXTERNAL_LLM_ENABLED: "${CURATOR_EXTERNAL_LLM_ENABLED:-false}"
      CURATOR_EXTERNAL_LLM_BASE_URL: "${CURATOR_EXTERNAL_LLM_BASE_URL:-https://api.openai.com/v1}"
      CURATOR_EXTERNAL_LLM_MODEL: "${CURATOR_EXTERNAL_LLM_MODEL:-gpt-4.1-mini}"
      CURATOR_EXTERNAL_LLM_API_KEY_FILE: "${CURATOR_EXTERNAL_LLM_API_KEY_FILE:-/secrets/external_llm_api_key}"
      CURATOR_PII_FILTER_BASE_URL: "${CURATOR_PII_FILTER_BASE_URL:-http://host.docker.internal:11434}"
      CURATOR_PII_FILTER_MODEL: "${CURATOR_PII_FILTER_MODEL:-ai-curator-pii-gemma3-4b}"
      CURATOR_PII_FILTER_DICTIONARY_FILE: "${CURATOR_PII_FILTER_DICTIONARY_FILE:-/secrets/pii_dictionary.txt}"
      CURATOR_PII_FILTER_TIMEOUT_SECONDS: "${CURATOR_PII_FILTER_TIMEOUT_SECONDS:-300}"
      CURATOR_PII_FILTER_BATCH_ITEMS: "${CURATOR_PII_FILTER_BATCH_ITEMS:-20}"
      CURATOR_PII_FILTER_BATCH_CHARS: "${CURATOR_PII_FILTER_BATCH_CHARS:-12000}"
      CURATOR_LLM_TIMEOUT_SECONDS: "${CURATOR_LLM_TIMEOUT_SECONDS:-1500}"
      CURATOR_LLM_TEMPERATURE: "${CURATOR_LLM_TEMPERATURE:-0.2}"
      CURATOR_LLM_MAX_TOKENS: "${CURATOR_LLM_MAX_TOKENS:-6000}"
      CURATOR_LLM_REASONING_EFFORT: "${CURATOR_LLM_REASONING_EFFORT:-none}"
      CURATOR_LLM_COMMENT_BATCH_CHARS: "${CURATOR_LLM_COMMENT_BATCH_CHARS:-20000}"
      CURATOR_LLM_REPAIR_ENABLED: "${CURATOR_LLM_REPAIR_ENABLED:-false}"
      CURATOR_LLM_LOG_REQUEST_RESPONSE: "${CURATOR_LLM_LOG_REQUEST_RESPONSE:-false}"
      CURATOR_JIRA_LOG_REQUEST_RESPONSE: "${CURATOR_JIRA_LOG_REQUEST_RESPONSE:-false}"
      CURATOR_JIRA_LOG_INVALID_RESPONSE_BODY: "${CURATOR_JIRA_LOG_INVALID_RESPONSE_BODY:-false}"
      CURATOR_JIRA_LOG_FIELD_CATALOG: "${CURATOR_JIRA_LOG_FIELD_CATALOG:-false}"
      CURATOR_JIRA_LOG_EMPLOYEE_ISSUE: "${CURATOR_JIRA_LOG_EMPLOYEE_ISSUE:-false}"
      CURATOR_JIRA_LOG_RESPONSE_MAX_CHARS: "${CURATOR_JIRA_LOG_RESPONSE_MAX_CHARS:-4000}"
      CURATOR_JIRA_MAX_COMMENTS: "${CURATOR_JIRA_MAX_COMMENTS:-50}"
      CURATOR_TOKEN_FILE: /secrets/jira_token
      CURATOR_HMAC_KEY_FILE: /secrets/hmac_key
      CURATOR_ALLOWED_HOSTS: '["127.0.0.1","localhost"]'
    volumes:
      - curator-data:/data
      - ./secrets:/secrets:ro
      - ${CURATOR_CA_DIR:-./certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [curator]

  model:
    profiles: [llama]
    image: ghcr.io/ggml-org/llama.cpp:server-b9445@sha256:8dd148c53936b6e8b0e75309841e66eab13adc50b004a5e86ab1fec477c17d8e
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3-4B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"
      - --parallel
      - "1"
      - --threads
      - "${LLAMA_THREADS:-8}"
      - --n-gpu-layers
      - "${LLAMA_GPU_LAYERS:-0}"
      - --jinja
      - --reasoning
      - "off"
      - --cache-ram
      - "0"
    expose: ["8080"]
    volumes:
      - ./models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12
    networks: [curator]

  mock-jira:
    profiles: [demo]
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-curator-app:0.1.0
    entrypoint: ["python", "-m", "uvicorn", "mock_jira.app:app", "--host", "0.0.0.0", "--port", "9000", "--no-access-log"]
    environment:
      PYTHONPATH: /app
      CURATOR_LLM_TIMEOUT_SECONDS: "${CURATOR_LLM_TIMEOUT_SECONDS:-1500}"
    volumes:
      - ./mock_jira:/app/mock_jira:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
    ports:
      - "127.0.0.1:9000:9000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [curator]

networks:
  curator:
    driver: bridge

volumes:
  curator-data:
